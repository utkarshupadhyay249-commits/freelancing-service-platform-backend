spring.application.name=pc-builder-backend

# MySQL Properties
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?createDatabaseIfNotExist=true&useUnicode=true
spring.datasource.username=${MYSQLUSER}
#enter the correct MySQL Password below
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

springdoc.packagesToScan=com.freelancing.controller
springdoc.pathsToMatch=/api/**

# File upload properties
com.freelancing.image.folder.path=${IMAGE_FOLDER}

com.freelancing.paymentGateway.razorpay.key=${RAZORPAY_KEY}
com.freelancing.paymentGateway.razorpay.secret=${RAZORPAY_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
